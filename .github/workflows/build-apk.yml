
name: Build FilmCraft APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar FilmCraft para Android
    runs-on: ubuntu-latest

    steps:
      - name: Configurar trabajo
        uses: actions/checkout@v4

      - name: Descargar y extraer proyecto
        run: |
          mkdir -p source
          unzip -q filmcraft-package-foundation.zip -d source
          test -f source/filmcraft-android-main/apps/filmcraft-android/android/gradlew

      - name: Instalar herramientas ZIP
        run: sudo apt-get update && sudo apt-get install -y unzip zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Compilar APK
        working-directory: source/filmcraft-android-main/apps/filmcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pfilmcraft.abis=arm64-v8a

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-APK
          path: source/filmcraft-android-main/apps/filmcraft-android/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
