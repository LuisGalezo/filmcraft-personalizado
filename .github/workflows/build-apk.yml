
name: Diagnosticar proyecto FilmCraft

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    name: Revisar estructura del ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramienta ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -q filmcraft-preview-quality-pass.zip -d source

      - name: Mostrar carpetas principales
        run: |
          echo "=== CARPETAS ==="
          find source -maxdepth 4 -type d | sort

      - name: Buscar archivos necesarios
        run: |
          echo "=== ARCHIVOS ENCONTRADOS ==="
          find source -maxdepth 10 -type f \( \
            -name "Cargo.toml" -o \
            -name "rust-toolchain.toml" -o \
            -name "gradlew" -o \
            -name "gradle.properties" \
          \) -print | sort

      - name: Finalizar diagnóstico
        run: |
          echo "Diagnóstico terminado."
