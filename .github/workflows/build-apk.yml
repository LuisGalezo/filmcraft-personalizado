
name: Build FilmCraft APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar FilmCraft para Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extraer proyecto
        run: |
          mkdir -p source
          unzip -q filmcraft-preview-quality-pass.zip -d source
          test -f source/Cargo.toml
          test -f source/rust-toolchain.toml
          test -f source/apps/filmcraft-android/android/gradlew

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Rust
        working-directory: source
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Instalar Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Compilar APK
        working-directory: source/apps/filmcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pfilmcraft.abis=arm64-v8a \
            -Pfilmcraft.unsigned=true \
            --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-APK
          path: source/apps/filmcraft-android/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
