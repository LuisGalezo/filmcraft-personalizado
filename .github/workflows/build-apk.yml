name: Build FilmCraft APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar FilmCraft para Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extraer y verificar proyecto
        run: |
          mkdir -p source
          unzip -q filmcraft-preview-quality-pass.zip -d source

          PROJECT="source/filmcraft-android-main"

          test -f "$PROJECT/Cargo.toml"
          test -f "$PROJECT/rust-toolchain.toml"
          test -f "$PROJECT/apps/filmcraft-android/android/gradlew"

          echo "Proyecto FilmCraft encontrado correctamente."

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android NDK
        uses: android-actions/setup-android@v3

      - name: Configurar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14206865"

      - name: Configurar Rust
        working-directory: source/filmcraft-android-main
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Compilar APK
        working-directory: source/filmcraft-android-main/apps/filmcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pfilmcraft.abis=arm64-v8a \
            --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-APK
          path: source/filmcraft-android-main/apps/filmcraft-android/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
