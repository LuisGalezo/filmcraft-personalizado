
name: Build Seven Cut Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Seven Cut Pro para Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar y extraer proyecto
        id: extract
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No se encontró ningún archivo ZIP."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          GRADLE_FILE=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No se encontró gradlew dentro del ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLE_FILE"

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar caché de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android NDK
        run: sdkmanager "ndk;29.0.14206865"

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Instalar cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Compilar APK Release
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: |
          ./gradlew assembleRelease -Pfilmcraft.abis=arm64-v8a

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Seven-Cut-Pro-APK
          path: ${{ steps.extract.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
